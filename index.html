<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mein Spiel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="start-container">
        <div class="start-text">IMPOSSIBLE QUIZ<br>REMAKE DELUXE 2.1</div>

        <button class="start-button" id="startButton">START</button>

        <form class="debug-level-form" id="debugLevelForm">
            <input class="debug-level-input" id="debugLevelInput" type="number" min="1" placeholder="LEVEL" aria-label="Level zum Überspringen">
            <button class="debug-level-button" type="submit">DEBUG</button>
        </form>
    </div>

    <main class="quiz-screen" id="quizScreen" hidden>
        <button class="game-status level-status" id="levelStatus" type="button">LEVEL: <span id="levelNumber">1</span></button>

        <div class="lives-wrapper">
            <div class="game-status lives-status">LEBEN: <span id="livesNumber">3</span></div>
            <div class="bomb-status" id="bombStatus" hidden aria-live="polite">
                <img class="bomb-image" id="bombImage" alt="Bombenanzeige" src="sonstiges/Bilder/Bombe/Unbenanntes_Projekt (10).png">
            </div>
        </div>

        <div class="question-area">
            <h1 class="question" id="question"></h1>

            <img class="level-image" id="levelImage" alt="" hidden>

            <div class="answer-buttons" id="answerButtons"></div>
            <p class="answer-feedback" id="answerFeedback" aria-live="polite"></p>
        </div>
    </main>

    <main class="game-over" id="gameOverScreen" hidden>
        <div class="game-over-title">DU HAST<br>VERLOREN!</div>
        <div class="game-over-restart">LADE DIE SEITE NEU, UM NEU ZU STARTEN!</div>
    </main>

    <script src="script.js"></script>

</body>
</html>
